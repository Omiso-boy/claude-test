<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>筋トレ記録</title>
  <meta name="description" content="シンプルな筋トレ記録アプリ">
  <meta name="theme-color" content="#111418">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="筋トレ記録">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" data-icon="logo"></span>
      <div>
        <h1>筋トレ記録</h1>
        <div class="brand-sub" id="brand-sub">本日のワークアウト</div>
      </div>
    </div>
    <div class="date-nav" id="date-nav">
      <button type="button" id="date-prev" class="date-arrow" aria-label="前の日" data-icon="chevronLeft"></button>
      <label class="date-label">
        <span class="date-cal" data-icon="calendar"></span>
        <span id="date-text"></span>
        <input type="date" id="f-date" required aria-label="日付を選ぶ">
      </label>
      <button type="button" id="date-next" class="date-arrow" aria-label="次の日" data-icon="chevronRight"></button>
    </div>
  </header>

  <main>
    <!-- 記録 -->
    <section id="view-record" class="view">
      <div id="reminder" class="reminder" hidden>
        <span>しばらくバックアップしていません</span>
        <button type="button" id="reminder-btn" class="btn small">今すぐ</button>
      </div>

      <section id="summary" class="card summary" aria-label="今日のまとめ">
        <div id="summary-body" class="fig-pair"></div>
        <div class="stats">
          <div class="stat"><span class="stat-lbl"><span data-icon="check"></span>セット</span><span class="stat-val" id="stat-sets">0</span></div>
          <div class="stat"><span class="stat-lbl"><span data-icon="record"></span>種目</span><span class="stat-val" id="stat-ex">0</span></div>
          <div class="stat"><span class="stat-lbl"><span data-icon="hourglass"></span>時間</span><span class="stat-val" id="stat-time">−</span></div>
        </div>
      </section>

      <section id="timer" class="card timer" aria-label="休憩タイマー">
        <div class="timer-title"><span data-icon="timer"></span>インターバルタイマー<span id="timer-status" class="timer-status" aria-live="polite"></span></div>
        <div class="timer-row">
          <div id="timer-clock" class="timer-clock" role="timer" aria-live="off">1:30</div>
          <div class="presets">
            <button type="button" class="preset" data-sec="60">60</button>
            <button type="button" class="preset" data-sec="90">90</button>
            <button type="button" class="preset" data-sec="120">120</button>
          </div>
          <button type="button" id="timer-toggle" class="timer-btn play" aria-label="スタート"></button>
          <button type="button" id="timer-reset" class="timer-btn" aria-label="リセット" data-icon="reset"></button>
        </div>
      </section>

      <!-- 種目を選ぶ -->
      <div id="pick-screen">
        <section id="today-box" class="card today" hidden>
          <div class="card-title"><span data-icon="clipboard"></span>今日の記録<span id="today-date" class="card-title-sub"></span></div>
          <ul id="today-list" class="today-list"></ul>
        </section>

        <div id="part-tabs" class="part-tabs" role="tablist" aria-label="部位"></div>
        <ul id="exercise-list" class="ex-list"></ul>

        <details id="add-exercise" class="card add-ex">
          <summary>＋ 種目を追加</summary>
          <form id="add-form" class="add-form" autocomplete="off">
            <input type="text" id="add-name" placeholder="種目名（例：ペックフライ）" maxlength="100">
            <select id="add-part" aria-label="部位"></select>
            <button type="submit" class="btn primary">追加する</button>
          </form>
        </details>
      </div>

      <!-- 種目ごとの記録 -->
      <div id="exercise-screen" hidden>
        <div class="ex-head">
          <button type="button" id="back-btn" class="back"><span data-icon="chevronLeft"></span>種目一覧</button>
          <div class="ex-title-row"><span id="ex-icon" class="ex-icon"></span><div><h2 id="ex-title"></h2><span id="ex-part" class="ex-part"></span></div></div>
        </div>

        <div id="previous" class="previous" hidden></div>

        <div class="card set-card">
          <div class="set-grid set-grid-head" aria-hidden="true">
            <span>セット</span><span>重量（kg）</span><span>回数</span><span></span>
          </div>
          <ol id="set-rows" class="set-rows"></ol>
          <button type="button" id="add-row" class="btn ghost">＋ セットを追加</button>
        </div>
        <label class="auto"><input type="checkbox" id="timer-auto"> ✓を押したら休憩タイマーを自動スタート</label>
      </div>
    </section>

    <!-- 履歴 -->
    <section id="view-history" class="view" hidden>
      <h2 class="section-title">履歴</h2>
      <div id="history-list"></div>
    </section>

    <!-- バックアップ -->
    <section id="view-backup" class="view" hidden>
      <h2 class="section-title">バックアップ</h2>
      <div class="card">
        <p id="backup-info" class="muted"></p>
        <button type="button" id="export-btn" class="btn primary">バックアップを保存（CSV）</button>
        <p class="help">共有メニューから Googleドライブ や「ファイル」に保存できます。CSVはスプレッドシートでも開けます。</p>
      </div>
      <div class="card">
        <label class="btn file-btn">
          バックアップから読み込む
          <input type="file" id="import-input" accept=".csv,text/csv">
        </label>
        <p class="help">今ある記録は消えません。まだない記録だけを追加します。機種変更のときにも使えます。</p>
      </div>
      <p class="help">記録はこのiPhoneの中だけに保存されています。定期的にバックアップしてください。</p>
    </section>
  </main>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="view-record" aria-selected="true"><span data-icon="record"></span>記録</button>
    <button class="tab" role="tab" data-view="view-history" aria-selected="false"><span data-icon="history"></span>履歴</button>
    <button class="tab" role="tab" data-view="view-backup" aria-selected="false"><span data-icon="backup"></span>バックアップ</button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
