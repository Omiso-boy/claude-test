<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>筋トレ記録</title>
  <meta name="description" content="シンプルな筋トレ記録アプリ">
  <meta name="theme-color" content="#111418">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="筋トレ記録">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>筋トレ記録</h1>
  </header>

  <main>
    <!-- 記録 -->
    <section id="view-record" class="view">
      <div id="reminder" class="reminder" hidden>
        <span>しばらくバックアップしていません</span>
        <button type="button" id="reminder-btn" class="btn small">今すぐ</button>
      </div>

      <form id="record-form" class="card form" autocomplete="off">
        <label class="row">
          <span class="lbl">日付</span>
          <input type="date" id="f-date" required>
        </label>

        <label class="field">
          <span class="lbl">種目</span>
          <input type="text" id="f-exercise" list="exercise-list" placeholder="例：ベンチプレス" maxlength="100" enterkeyhint="next">
          <datalist id="exercise-list"></datalist>
        </label>
        <div id="chips" class="chips"></div>

        <div id="previous" class="previous" hidden></div>

        <div class="nums">
          <div class="num">
            <span class="lbl">重量（kg）</span>
            <div class="stepper">
              <button type="button" id="w-minus" aria-label="重量を減らす">−</button>
              <input type="text" id="f-weight" inputmode="decimal" placeholder="0">
              <button type="button" id="w-plus" aria-label="重量を増やす">＋</button>
            </div>
          </div>
          <div class="num">
            <span class="lbl">回数</span>
            <div class="stepper">
              <button type="button" id="r-minus" aria-label="回数を減らす">−</button>
              <input type="text" id="f-reps" inputmode="numeric" placeholder="0">
              <button type="button" id="r-plus" aria-label="回数を増やす">＋</button>
            </div>
          </div>
        </div>

        <label class="field">
          <span class="lbl">メモ（任意）</span>
          <input type="text" id="f-note" maxlength="100" placeholder="例：フォーム意識">
        </label>

        <button type="submit" class="btn primary">記録する</button>
      </form>

      <section id="timer" class="card timer" aria-label="休憩タイマー">
        <div class="timer-head">
          <span class="lbl">休憩タイマー</span>
          <label class="auto"><input type="checkbox" id="timer-auto"> 記録したら自動スタート</label>
        </div>
        <div id="timer-clock" class="timer-clock" role="timer" aria-live="off">1:30</div>
        <div id="timer-status" class="timer-status" aria-live="polite"></div>
        <div class="presets">
          <button type="button" class="preset" data-sec="60">60秒</button>
          <button type="button" class="preset" data-sec="90">90秒</button>
          <button type="button" class="preset" data-sec="120">120秒</button>
        </div>
        <div class="timer-ctrl">
          <button type="button" id="timer-toggle" class="btn">スタート</button>
          <button type="button" id="timer-reset" class="btn">リセット</button>
        </div>
      </section>

      <h2 id="day-title" class="section-title"></h2>
      <div id="day-list"></div>
    </section>

    <!-- 履歴 -->
    <section id="view-history" class="view" hidden>
      <h2 class="section-title">履歴</h2>
      <div id="history-list"></div>
    </section>

    <!-- バックアップ -->
    <section id="view-backup" class="view" hidden>
      <h2 class="section-title">バックアップ</h2>
      <div class="card">
        <p id="backup-info" class="muted"></p>
        <button type="button" id="export-btn" class="btn primary">バックアップを保存（CSV）</button>
        <p class="help">共有メニューから Googleドライブ や「ファイル」に保存できます。CSVはスプレッドシートでも開けます。</p>
      </div>
      <div class="card">
        <label class="btn file-btn">
          バックアップから読み込む
          <input type="file" id="import-input" accept=".csv,text/csv">
        </label>
        <p class="help">今ある記録は消えません。まだない記録だけを追加します。機種変更のときにも使えます。</p>
      </div>
      <p class="help">記録はこのiPhoneの中だけに保存されています。定期的にバックアップしてください。</p>
    </section>
  </main>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="view-record" aria-selected="true">記録</button>
    <button class="tab" role="tab" data-view="view-history" aria-selected="false">履歴</button>
    <button class="tab" role="tab" data-view="view-backup" aria-selected="false">バックアップ</button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
